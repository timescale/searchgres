name: Evaluation Compose smoke

on:
  # The Ollama image and model are intentionally too large for every PR. Run
  # this Linux amd64 gate manually before releases and after stack/model changes.
  workflow_dispatch:

permissions:
  contents: read

jobs:
  smoke:
    name: Full stack (Linux amd64)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5
      - run: ./bun run test:compose
