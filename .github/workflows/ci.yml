name: CI

on:
  push:
    branches: [main]
  pull_request:

# A superseded run on the same branch has nothing useful left to say.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    name: Typecheck and lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - run: ./bun install --frozen-lockfile
      - run: ./bun run check:filter-grammar
      - run: ./bun run typecheck
      - run: ./bun run lint
      - run: docker compose config --quiet

  docker-server:
    name: Clean server image build
    runs-on: ubuntu-latest
    needs: check
    steps:
      - uses: actions/checkout@v5
      - run: docker build -f docker/Dockerfile.server .

  test:
    name: Unit tests (node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 22 is the oldest supported line; 24 is current LTS. Both must pass,
        # so we learn about version-specific breakage here rather than from a
        # user's install.
        node: [22, 24]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ matrix.node }}
      - run: ./bun install --frozen-lockfile
      # Same script as local runs, so CI can't diverge from what developers
      # verify against. The libraries' suites run on the Node in the matrix.
      - run: ./bun run test:unit

  test-db:
    name: Database integration tests
    runs-on: ubuntu-latest
    needs: check
    env:
      TEST_DATABASE_URL: postgresql://postgres@127.0.0.1:5432/postgres
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
      - run: ./bun install --frozen-lockfile
      # with-postgres.ts owns the container lifecycle, shared verbatim with the
      # local `check:full` run rather than duplicated as workflow shell.
      - run: ./bun scripts/with-postgres.ts ./bun run test:db

  # The unit tests run from TypeScript source, so nothing above ever loads the
  # compiled output. This job packs the tarball, installs it into a scratch
  # project, and imports it *by package name* — which is the only way to
  # exercise the exports map, the files array, and emitted ESM specifiers the
  # way a real consumer would.
  artifact:
    name: Packaged install (${{ matrix.runtime }})
    runs-on: ubuntu-latest
    needs: check
    strategy:
      fail-fast: false
      matrix:
        runtime: [node, bun, deno]
    steps:
      - uses: actions/checkout@v5
      # Node is needed for the tarball's prepack hook and, for the node matrix
      # leg, to import the result.
      - uses: actions/setup-node@v5
        with:
          node-version: 24
      - uses: denoland/setup-deno@v2
        if: matrix.runtime == 'deno'
        with:
          deno-version: v2.x
      - run: ./bun install --frozen-lockfile
      - run: ./bun run build

      - name: Import private runtime-neutral builds
        run: |
          script='const f = await import("./packages/filter/dist/index.js");
                  const p = await import("./packages/presentation/dist/index.js");
                  const filter = f.parseFilter("(tree docs)");
                  const selection = p.parseSelection(["id"], { kind: "search-result" });
                  if (filter.tree !== "docs" || !selection.fields.has("id"))
                    throw new Error("private package smoke failed");'
          case "${{ matrix.runtime }}" in
            node) node --input-type=module -e "$script" ;;
            bun)  ./bun -e "$script" ;;
            deno) deno eval --no-lock "$script" ;;
          esac

      # A real consumer installs with npm, so the scratch project does too —
      # this leg deliberately exercises the npm install path the published
      # package is consumed through, whatever runtime imports it afterwards.
      - name: Pack and install into a scratch project
        run: |
          ./bun pm pack --cwd packages/core --destination /tmp
          mkdir -p /tmp/consumer
          cd /tmp/consumer
          npm init -y > /dev/null
          npm install /tmp/searchgres-*.tgz

      - name: Legal files are present in the published package
        run: |
          cd /tmp/consumer/node_modules/searchgres
          for f in LICENSE NOTICE README.md; do
            test -s "$f" || { echo "missing from published package: $f"; exit 1; }
          done

      - name: Import by package name
        working-directory: /tmp/consumer
        run: |
          # "searchgres", not a relative path: resolving the bare specifier is
          # what proves the exports map and files array are correct.
          script='const m = await import("searchgres");
                  if (!m.LIBRARY_VERSION) throw new Error("LIBRARY_VERSION missing from the published entry point");
                  console.log("ok", m.LIBRARY_VERSION);'
          case "${{ matrix.runtime }}" in
            node) node --input-type=module -e "$script" ;;
            # The pinned wrapper, by absolute path: the scratch project is
            # outside the repository, and bun is not otherwise on PATH here.
            bun)  "$GITHUB_WORKSPACE/bun" -e "$script" ;;
            deno) deno eval --no-lock "$script" ;;
          esac

  # Branch protection requires only this stable aggregate context. Matrix legs
  # and implementation-specific jobs can change without silently weakening the
  # gate: this job succeeds only when every CI job above succeeded.
  ci:
    name: ci
    if: always()
    runs-on: ubuntu-latest
    needs: [check, docker-server, test, test-db, artifact]
    steps:
      - name: Require every CI job to pass
        env:
          CHECK_RESULT: ${{ needs.check.result }}
          DOCKER_SERVER_RESULT: ${{ needs['docker-server'].result }}
          TEST_RESULT: ${{ needs.test.result }}
          TEST_DB_RESULT: ${{ needs['test-db'].result }}
          ARTIFACT_RESULT: ${{ needs.artifact.result }}
        run: |
          set -euo pipefail
          for result in \
            "$CHECK_RESULT" \
            "$DOCKER_SERVER_RESULT" \
            "$TEST_RESULT" \
            "$TEST_DB_RESULT" \
            "$ARTIFACT_RESULT"
          do
            if [ "$result" != success ]; then
              echo "A required CI job did not succeed: $result" >&2
              exit 1
            fi
          done
