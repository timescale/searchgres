# One config for host CLI/MCP and Compose init/worker. Set endpoint environment
# variables for your network location; see .env.sample and the evaluation guide.
version: 1
database:
  urlEnv: SEARCHGRES_DATABASE_URL
index:
  schema: searchgres
  dimensions: 768
  vectorType: halfvec
embedding:
  provider: openai-compatible
  model: nomic-embed-text
  baseUrlEnv: SEARCHGRES_EMBEDDING_BASE_URL
  requestTimeout: 30s
  truncate:
    kind: tokens
    tokenizer: nomic-embed-text-v1.5
    maxTokens: 8192
worker:
  count: 1
  interval: 1s
  batchSize: 100
