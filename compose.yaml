# Unauthenticated, loopback-bound evaluation only. Not production guidance.
# docker compose up -d --build; docker compose down preserves data/model volumes.
x-ollama-image: &ollama-image ollama/ollama:0.15.4
x-ollama-model: &ollama-model nomic-embed-text
x-searchgres-image: &searchgres-image searchgres-evaluation
x-searchgres-config: &searchgres-config ./docker/evaluation/searchgres.yaml:/config/searchgres.yaml:ro
x-database-url: &database-url postgresql://postgres@db:5432/postgres

services:
  db:
    build:
      context: ./docker
      dockerfile: Dockerfile.postgres
    environment:
      POSTGRES_HOST_AUTH_METHOD: trust
    healthcheck:
      test: ["CMD-SHELL", "psql -U postgres -d postgres -c 'select 1' >/dev/null"]
      interval: 2s
      timeout: 3s
      retries: 30
    ports:
      - "127.0.0.1:${SEARCHGRES_POSTGRES_PORT:-5432}:5432"
    volumes:
      - searchgres-db:/var/lib/postgresql

  ollama:
    image: *ollama-image
    # `ollama list` checks the running HTTP API (does not just inspect files).
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 2s
      timeout: 5s
      retries: 60
    ports:
      - "127.0.0.1:${SEARCHGRES_OLLAMA_PORT:-11434}:11434"
    volumes:
      - searchgres-ollama:/root/.ollama

  model:
    image: *ollama-image
    depends_on:
      ollama:
        condition: service_healthy
    environment:
      OLLAMA_HOST: http://ollama:11434
    command: ["pull", *ollama-model]
    volumes:
      - searchgres-ollama:/root/.ollama

  init:
    image: *searchgres-image
    build:
      context: .
      dockerfile: docker/Dockerfile.cli
    depends_on:
      db:
        condition: service_healthy
    environment:
      SEARCHGRES_DATABASE_URL: *database-url
    command: ["init", "--config", "/config/searchgres.yaml", "--no-env-file", "--if-not-exists"]
    volumes:
      - *searchgres-config

  worker:
    image: *searchgres-image
    build:
      context: .
      dockerfile: docker/Dockerfile.cli
    depends_on:
      init:
        condition: service_completed_successfully
      model:
        condition: service_completed_successfully
    environment:
      SEARCHGRES_DATABASE_URL: *database-url
      SEARCHGRES_EMBEDDING_BASE_URL: http://ollama:11434/v1
    command: ["embeddings", "worker", "--config", "/config/searchgres.yaml", "--no-env-file"]
    stop_grace_period: 70s
    restart: "on-failure:3"
    volumes:
      - *searchgres-config

volumes:
  searchgres-db:
  searchgres-ollama:
